<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Logo Trạm Bánh — pin định vị hồng, chữ T + tim, vẽ lại từ logo gốc -->
  <ellipse cx="50" cy="91" rx="17" ry="5.5" fill="#F5A9C9"/>
  <ellipse cx="50" cy="91" rx="9" ry="2.8" fill="#DE4E8D"/>
  <!-- thân pin: đầu tròn + đuôi nhọn -->
  <path d="M50 3.5
           C69.5 3.5 84 17.5 84 35.5
           C84 48.5 75.5 58 66.5 65.5
           L50 87.5
           L33.5 65.5
           C24.5 58 16 48.5 16 35.5
           C16 17.5 30.5 3.5 50 3.5 Z"
        fill="#F27DAC" stroke="#FDF3E3" stroke-width="4.5"/>
  <!-- vòng kem trong -->
  <circle cx="50" cy="35" r="21.5" fill="#FDF3E3"/>
  <!-- chữ T -->
  <g fill="#F27DAC">
    <rect x="33.5" y="23" width="33" height="11" rx="3.5"/>
    <rect x="43.5" y="23" width="13" height="26" rx="3.5"/>
  </g>
  <!-- tim khoét màu aqua trên chữ T -->
  <path d="M50 32.6
           c -1.4 -3.4 -5.6 -3.2 -5.6 0
           c 0 2.3 3.2 4.3 5.6 5.9
           c 2.4 -1.6 5.6 -3.6 5.6 -5.9
           c 0 -3.2 -4.2 -3.4 -5.6 0 Z"
        fill="#8FE3DF"/>
  <!-- lấp lánh vàng -->
  <g fill="#FFD84D">
    <path d="M74 10 l1.8 4.6 4.6 1.8 -4.6 1.8 -1.8 4.6 -1.8 -4.6 -4.6 -1.8 4.6 -1.8 Z"/>
    <path d="M83 24 l1.1 2.8 2.8 1.1 -2.8 1.1 -1.1 2.8 -1.1 -2.8 -2.8 -1.1 2.8 -1.1 Z"/>
    <path d="M22 62 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4 Z"/>
    <path d="M15 54 l0.9 2.3 2.3 0.9 -2.3 0.9 -0.9 2.3 -0.9 -2.3 -2.3 -0.9 2.3 -0.9 Z"/>
  </g>
</svg>
